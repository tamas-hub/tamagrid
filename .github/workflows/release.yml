name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.21.0
          runtime: node@22
          cache: true
          install: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Require the tag commit to belong to main
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit contained in origin/main"
          }
      - name: Verify tag, package, Tauri, Cargo, and release-note versions
        shell: pwsh
        run: node scripts/verify-release-version.mjs $env:GITHUB_REF_NAME
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level moderate
      - run: pnpm check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust lockfile
        run: >-
          cargo audit --file src-tauri/Cargo.lock
          --deny unsound --deny yanked
          --ignore RUSTSEC-2024-0429

  publish:
    needs: quality
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi
            pnpm_bootstrap: native
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
            pnpm_bootstrap: native
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
            pnpm_bootstrap: npm
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm and Node
        if: matrix.pnpm_bootstrap == 'native'
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.21.0
          runtime: node@22
          cache: true
          install: false
      # pnpm v11's native darwin-x64 executable is affected by the upstream
      # Node SEA bug tracked at pnpm/pnpm#11423. Keep the project on the same
      # exact pnpm version and use its npm package only for the Intel runner.
      - name: Set up Node for Intel macOS
        if: matrix.pnpm_bootstrap == 'npm'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install exact pnpm for Intel macOS
        if: matrix.pnpm_bootstrap == 'npm'
        run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.21.0
      - name: Report pinned JavaScript toolchain
        run: |
          node --version
          pnpm --version
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: TamaGrid ${{ github.ref_name }}
          releaseBody: |
            Public Preview release of TamaGrid.

            **Important distribution notice**

            - Windows artifacts are unsigned and may trigger Microsoft Defender SmartScreen.
            - macOS artifacts are ad-hoc signed and are not Developer ID notarized.
            - Verify every downloaded artifact against `SHA256SUMS.txt` before installing.
            - `RELEASE_NOTES.md`, `THIRD_PARTY_NOTICES.md`, and `tamagrid-js.cdx.json` are attached to the release.
            - TamaGrid is an independent project and is not affiliated with or endorsed by OpenAI.

            This workflow intentionally creates a draft prerelease. Review the artifacts and checksums before publishing it.
          releaseDraft: true
          prerelease: true
          uploadUpdaterJson: false
          args: ${{ matrix.args }}
      - name: Prepare build subjects for attestation
        id: subjects
        shell: pwsh
        env:
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          $paths = @($env:TAURI_ARTIFACT_PATHS | ConvertFrom-Json) |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }
          if ($paths.Count -eq 0) {
            throw "Tauri produced no file artifacts to attest"
          }
          $delimiter = "TAMAGRID_PATHS_$([guid]::NewGuid().ToString('N'))"
          "paths<<$delimiter" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          $paths | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          $delimiter | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.subjects.outputs.paths }}

  checksums:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.21.0
          runtime: node@22
          install: false
      - name: Download draft release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release-artifacts
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-artifacts
      - name: Add release metadata
        run: |
          notes_path="docs/release-notes/${GITHUB_REF_NAME}.md"
          test -f "$notes_path"
          cp "$notes_path" release-artifacts/RELEASE_NOTES.md
          cp THIRD_PARTY_NOTICES.md release-artifacts/THIRD_PARTY_NOTICES.md
          pnpm sbom --sbom-format cyclonedx --lockfile-only --prod --sbom-type application --sbom-authors "TamaGrid contributors" --out release-artifacts/tamagrid-js.cdx.json
      - name: Generate SHA-256 manifest
        working-directory: release-artifacts
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      # Tauri's macOS upload wraps each .app bundle in a .app.tar.gz file after
      # the platform build job has selected its attestation subjects. Attest
      # the exact downloadable package files here so every Release asset, not
      # only the DMGs and Windows installers, has verifiable provenance.
      - name: Attest downloadable release packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-artifacts/TamaGrid_*
      - name: Verify every downloadable package attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -d '' artifacts < <(
            find release-artifacts -maxdepth 1 -type f -name 'TamaGrid_*' -print0 | sort -z
          )
          test "${#artifacts[@]}" -eq 6
          for artifact in "${artifacts[@]}"; do
            verified=false
            for attempt in 1 2 3; do
              if gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"; then
                verified=true
                break
              fi
              sleep 5
            done
            test "$verified" = true
          done
      - name: Attest checksum manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-artifacts/SHA256SUMS.txt
      - name: Attest release metadata
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-artifacts/RELEASE_NOTES.md
            release-artifacts/THIRD_PARTY_NOTICES.md
            release-artifacts/tamagrid-js.cdx.json
      - name: Upload release metadata and checksum manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            release-artifacts/RELEASE_NOTES.md \
            release-artifacts/THIRD_PARTY_NOTICES.md \
            release-artifacts/tamagrid-js.cdx.json \
            release-artifacts/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
