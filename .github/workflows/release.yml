name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  publish:
    needs: quality
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: TamaGrid ${{ github.ref_name }}
          releaseBody: |
            Public Preview release of TamaGrid.

            **Important distribution notice**

            - Windows artifacts are unsigned and may trigger Microsoft Defender SmartScreen.
            - macOS artifacts are ad-hoc signed and are not Developer ID notarized.
            - Verify every downloaded artifact against `SHA256SUMS.txt` before installing.
            - `RELEASE_NOTES.md`, `THIRD_PARTY_NOTICES.md`, and `tamagrid-js.cdx.json` are attached to the release.
            - TamaGrid is an independent project and is not affiliated with or endorsed by OpenAI.

            This workflow intentionally creates a draft prerelease. Review the artifacts and checksums before publishing it.
          releaseDraft: true
          prerelease: true
          uploadUpdaterJson: false
          args: ${{ matrix.args }}
      - name: Prepare build subjects for attestation
        id: subjects
        shell: pwsh
        env:
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          $paths = @($env:TAURI_ARTIFACT_PATHS | ConvertFrom-Json) |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }
          if ($paths.Count -eq 0) {
            throw "Tauri produced no file artifacts to attest"
          }
          $delimiter = "TAMAGRID_PATHS_$([guid]::NewGuid().ToString('N'))"
          "paths<<$delimiter" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          $paths | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          $delimiter | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.subjects.outputs.paths }}

  checksums:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Download draft release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release-artifacts
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-artifacts
      - name: Add release metadata
        run: |
          notes_path="docs/release-notes/${GITHUB_REF_NAME}.md"
          test -f "$notes_path"
          cp "$notes_path" release-artifacts/RELEASE_NOTES.md
          cp THIRD_PARTY_NOTICES.md release-artifacts/THIRD_PARTY_NOTICES.md
          pnpm sbom --sbom-format cyclonedx --lockfile-only --prod --sbom-type application --sbom-authors "TamaGrid contributors" --out release-artifacts/tamagrid-js.cdx.json
      - name: Generate SHA-256 manifest
        working-directory: release-artifacts
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Attest checksum manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-artifacts/SHA256SUMS.txt
      - name: Attest release metadata
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-artifacts/RELEASE_NOTES.md
            release-artifacts/THIRD_PARTY_NOTICES.md
            release-artifacts/tamagrid-js.cdx.json
      - name: Upload release metadata and checksum manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            release-artifacts/RELEASE_NOTES.md \
            release-artifacts/THIRD_PARTY_NOTICES.md \
            release-artifacts/tamagrid-js.cdx.json \
            release-artifacts/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
