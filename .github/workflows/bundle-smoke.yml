name: Bundle smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi
            artifact-path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**
            pnpm_bootstrap: native
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
            artifact-path: src-tauri/target/aarch64-apple-darwin/release/bundle/**
            pnpm_bootstrap: native
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
            artifact-path: src-tauri/target/x86_64-apple-darwin/release/bundle/**
            pnpm_bootstrap: npm
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm and Node
        if: matrix.pnpm_bootstrap == 'native'
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.21.0
          runtime: node@22
          cache: true
          install: false
      # pnpm v11's native darwin-x64 executable is affected by the upstream
      # Node SEA bug tracked at pnpm/pnpm#11423. Keep the project on the same
      # exact pnpm version and use its npm package only for the Intel runner.
      - name: Set up Node for Intel macOS
        if: matrix.pnpm_bootstrap == 'npm'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install exact pnpm for Intel macOS
        if: matrix.pnpm_bootstrap == 'npm'
        run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.21.0
      - name: Report pinned JavaScript toolchain
        run: |
          node --version
          pnpm --version
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Exercise the packaged Tauri Channel and WebView
        run: >-
          pnpm test:packaged-soak --
          --duration-ms 30000
          --target ${{ matrix.target }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
      - name: Build unsigned smoke-test bundle
        run: pnpm tauri build ${{ matrix.args }}
        env:
          VITE_TAMAGRID_SOAK: "0"
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
      - name: Retain bundle for manual inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tamagrid-${{ matrix.target }}-unsigned-smoke-${{ github.sha }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
