name: Feature request
description: Propose a focused improvement to TamaGrid
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the workflow problem before describing a UI or implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Security and compatibility impact
      description: Note any command execution, approval, credential, remote transport, or experimental App Server implications.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request does not require TamaGrid to collect or store OpenAI credentials.
          required: true
