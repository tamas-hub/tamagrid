<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">TamaGrid social preview</title>
  <desc id="description">A dark local-first Codex cockpit with four task panes, cyan and amber accents, and the TamaGrid wordmark.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9db4c8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000814" flood-opacity="0.48"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#071522"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1138" cy="72" r="164" fill="#25d7e5" fill-opacity="0.055"/>
  <circle cx="92" cy="590" r="214" fill="#f3b13f" fill-opacity="0.045"/>

  <g transform="translate(70 62)">
    <g transform="translate(0 2)">
      <rect width="58" height="58" rx="15" fill="#111d29" stroke="#42576b" stroke-width="2"/>
      <rect x="10" y="10" width="38" height="38" rx="8" fill="#172532" stroke="#52697d" stroke-width="2"/>
      <path d="M29 11V47M11 29H47" stroke="#52697d" stroke-width="2"/>
      <rect x="16" y="16" width="9" height="4" rx="2" fill="#25d7e5"/>
      <rect x="34" y="16" width="9" height="4" rx="2" fill="#f3b13f"/>
      <path d="M17 39l7-7 7 7-7 7z" fill="#25d7e5"/>
      <path d="M33 44h11v-5h-6l6-7h-6l-5 6z" fill="#f3b13f"/>
    </g>
    <text x="78" y="38" fill="#f5f8fb" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="750" letter-spacing="0.2">TamaGrid</text>
    <text x="79" y="61" fill="#7f96aa" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="650" letter-spacing="3.5">LOCAL-FIRST CODEX COCKPIT</text>

    <text x="0" y="170" fill="#f5f8fb" font-family="Segoe UI, Arial, sans-serif" font-size="57" font-weight="760" letter-spacing="-1.4">Four Codex tasks.</text>
    <text x="0" y="234" fill="#f5f8fb" font-family="Segoe UI, Arial, sans-serif" font-size="57" font-weight="760" letter-spacing="-1.4">One workspace.</text>
    <text x="1" y="286" fill="#afc0cf" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="450">Run and supervise four local Codex tasks.</text>
    <text x="1" y="318" fill="#afc0cf" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="450">No relay server. No extra API subscription.</text>

    <g transform="translate(0 366)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650">
      <g>
        <rect width="116" height="38" rx="19" fill="#102634" stroke="#2c7280"/>
        <circle cx="20" cy="19" r="5" fill="#25d7e5"/>
        <text x="34" y="24" fill="#dce8ef">Local-first</text>
      </g>
      <g transform="translate(130)">
        <rect width="164" height="38" rx="19" fill="#1f2630" stroke="#7b6337"/>
        <circle cx="20" cy="19" r="5" fill="#f3b13f"/>
        <text x="34" y="24" fill="#e9e2d2">Windows + macOS</text>
      </g>
      <g transform="translate(308)">
        <rect width="112" height="38" rx="19" fill="#182330" stroke="#42576b"/>
        <text x="19" y="24" fill="#dce8ef">Open source</text>
      </g>
    </g>

    <text x="1" y="492" fill="#6f879a" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="550">github.com/tamas-hub/tamagrid</text>
  </g>

  <g transform="translate(565 70)" filter="url(#shadow)">
