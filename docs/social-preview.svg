        <circle cx="264" cy="24" r="4" fill="#25d7e5"/>
        <path d="M18 48H280" stroke="#2b4a5d"/>
        <rect x="18" y="70" width="164" height="8" rx="4" fill="#6f879a" fill-opacity="0.58"/>
        <rect x="18" y="92" width="232" height="8" rx="4" fill="#6f879a" fill-opacity="0.35"/>
        <rect x="18" y="114" width="196" height="8" rx="4" fill="#25d7e5" fill-opacity="0.56"/>
        <rect x="18" y="144" width="230" height="24" rx="9" fill="#091a27" stroke="#2d4659"/>
        <rect x="258" y="144" width="22" height="24" rx="8" fill="#15414c"/>
      </g>
      <g transform="translate(312)">
        <rect width="298" height="184" rx="18" fill="#111f36" fill-opacity="0.88" stroke="#3b526d" stroke-width="1.5"/>
        <text x="18" y="29" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Refactor UI</text>
        <circle cx="264" cy="24" r="4" fill="#f3b13f"/>
        <path d="M18 48H280" stroke="#2e405b"/>
        <rect x="18" y="70" width="118" height="8" rx="4" fill="#7d8fa8" fill-opacity="0.56"/>
        <rect x="18" y="92" width="218" height="8" rx="4" fill="#7d8fa8" fill-opacity="0.32"/>
        <rect x="18" y="114" width="174" height="8" rx="4" fill="#f3b13f" fill-opacity="0.58"/>
        <rect x="18" y="144" width="230" height="24" rx="9" fill="#091525" stroke="#30445f"/>
        <rect x="258" y="144" width="22" height="24" rx="8" fill="#3d321c"/>
      </g>
      <g transform="translate(0 198)">
        <rect width="298" height="184" rx="18" fill="#111f31" fill-opacity="0.86" stroke="#344b60" stroke-width="1.5"/>
        <text x="18" y="29" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Security audit</text>
        <circle cx="264" cy="24" r="4" fill="#25d7e5"/>
        <path d="M18 48H280" stroke="#2d4356"/>
        <rect x="18" y="70" width="205" height="8" rx="4" fill="#6f879a" fill-opacity="0.52"/>
        <rect x="18" y="92" width="154" height="8" rx="4" fill="#6f879a" fill-opacity="0.34"/>
        <rect x="18" y="114" width="226" height="8" rx="4" fill="#25d7e5" fill-opacity="0.42"/>
        <rect x="18" y="144" width="230" height="24" rx="9" fill="#091725" stroke="#2d4559"/>
        <rect x="258" y="144" width="22" height="24" rx="8" fill="#153944"/>
      </g>
      <g transform="translate(312 198)">
        <rect width="298" height="184" rx="18" fill="#101d2b" fill-opacity="0.88" stroke="#34485a" stroke-width="1.5"/>
        <text x="18" y="29" fill="#e8f1f5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Docs &amp; tests</text>
        <circle cx="264" cy="24" r="4" fill="#7990a3"/>
        <path d="M18 48H280" stroke="#2b3e50"/>
        <rect x="18" y="70" width="176" height="8" rx="4" fill="#6f879a" fill-opacity="0.5"/>
        <rect x="18" y="92" width="224" height="8" rx="4" fill="#6f879a" fill-opacity="0.34"/>
        <rect x="18" y="114" width="132" height="8" rx="4" fill="#f3b13f" fill-opacity="0.4"/>
        <rect x="18" y="144" width="230" height="24" rx="9" fill="#091725" stroke="#2c4153"/>
        <rect x="258" y="144" width="22" height="24" rx="8" fill="#26303a"/>
      </g>
    </g>
  </g>
</svg>
